name: astrbot_plugin_yc_stats
display_name: 验车记录统计
desc: |
  记录群内 #验车 指令后面的磁力名称（只记录前 20 字），按「群 + 日期 + 链接」统计同一磁力链接一天被发送了几次；
  每晚 23:00（可配置）自动把当天战报渲染成二次元风格图片推送到群；
  WebUI 提供群白名单管理页，支持开关记录、调整推送时间、立即预览/推送战报。
short_desc: #验车 磁力名称记录 + 每日二次元战报图 + 群白名单
version: v1.0.12
author: jusanlius
repo: https://github.com/jusanlius/astrbot_plugin_yc_stats
tags:
  - 磁力
  - 验车
  - 群统计
  - 战报图
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - kook
  - satori
  - slack
  - lark
  - dingtalk
  - matrix
  - misskey
  - line
